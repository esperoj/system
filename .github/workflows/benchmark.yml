
name: Runner Benchmark (YABS + NWS)

on:
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: Benchmark (${{ matrix.arch }})
    runs-on: ${{ matrix.runon }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - runon: bp-ubuntu-latest-x64-2x
            arch: x64
          - runon: bp-ubuntu-latest-arm64-2x
            arch: arm64

    steps:
      - name: Inspect machine
        run: |
          uname -a
          lscpu
          free -h
          df -h /

      - name: Run YABS
        run: |
          mkdir -p out
          LOG="out/yabs-$(date -u +%Y%m%dT%H%M%SZ).txt"

          set -o pipefail
          curl -sL yabs.sh | bash 2>&1 | tee "$LOG"

      - name: Run NWS
        run: |
          mkdir -p out
          LOG="out/nws-$(date -u +%Y%m%dT%H%M%SZ).txt"

          set -o pipefail
          curl -sL nws.sh | bash 2>&1 | tee "$LOG"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn
          retention-days: 90

