name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSLo /tmp/shfmt 'https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64'
          sudo install -m0755 /tmp/shfmt /usr/local/bin/shfmt
      - run: make lint

  debian-image:
    name: Debian image (docker-base profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Build image
        run: docker build -t system:base .
      - name: Smoke test
        run: |
          docker run --rm system:base bash -lc '
            command -v dot vault install-sys-pkg fetch-bin install-tool stow
            dot ls
          '

  debian-rootless:
    name: Debian rootless (pubnix simulation)
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      # The pubnix contract, faithfully: the host (here: the container
      # admin) provides the baseline tools AND installs sudo — every real
      # pubnix has the binary, for its admins — while the user holds no
      # root and no sudoers rights. The commissioning below must finish
      # without ever invoking sudo: there is no terminal for a password,
      # so any attempt (password prompt or policy refusal) fails the
      # script outright. A sudo binary on PATH is never usable privilege.
      - name: Install host-provided tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git make curl perl ca-certificates unzip xz-utils bzip2 sudo
      - uses: actions/checkout@main
      - name: Commission base profile as an unprivileged user
        run: |
          useradd -m tester
          chown -R tester:tester "$PWD"
          printf '%s\n' \
            'set -eu' \
            'cd "$1"' \
            './bootstrap base' \
            'make base' \
            'export PATH="$HOME/.local/bin:$PATH"' \
            'command -v dot vault jq rclone age 7z stow' \
            'test -f "$HOME/.local/share/bash-completion/completions/make"' \
            'dot ls' \
            'make update' \
            'make jq-uninstall' \
            '! command -v jq' \
            'install-sys-pkg ripgrep >/tmp/probe.log 2>&1' \
            'grep -q "skipping system packages" /tmp/probe.log' \
            > /tmp/verify.sh
          su tester -c "sh /tmp/verify.sh '$PWD'"

  termux:
    name: Termux (phone profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Commission phone profile in Termux
        run: |
          # A device enters Termux through `login`, which exports
          # LD_PRELOAD=libtermux-exec-ld-preload.so -- the execve() hook
          # that rewrites #!/bin/sh shebangs to the Termux prefix -- and
          # then execs the shell. The docker image starts bash without it,
          # and exporting LD_PRELOAD mid-script is too late: the hook must
          # be loaded in the process that calls execve, so it has to be in
          # the environment the shell is started with. Run the whole
          # commissioning script through `login -c`, exactly as on a phone.
          docker run --rm -v "$PWD:/src:ro" termux/termux-docker login -c '
            set -e
            test -n "${LD_PRELOAD:-}" || {
              echo "login set no LD_PRELOAD; is termux-exec missing?" >&2
              exit 1
            }
            mkdir -p ~/projects/system
            cp -a /src/. ~/projects/system/
            cd ~/projects/system
            ./bootstrap phone
            make phone
            export PATH="$HOME/.local/bin:$PATH"
            command -v dot vault jq rclone restic age 7z stow
            dot ls
            make update
          '
